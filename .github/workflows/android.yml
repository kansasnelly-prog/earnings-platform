name: Remote Standalone APK Builder

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
  push:
    branches:
      - main

jobs:
  build:
    name: Build Standalone Sreymara Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies & Build Web Assets
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build || true
          fi
          if [ -f capacitor.config.json ] || [ -f capacitor.config.ts ]; then
            npx cap sync android || true
          fi

      - name: Grant Execute Permission to Gradle
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          elif [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android APK with Gradle
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f android/gradlew ]; then
            cd android && ./gradlew assembleDebug --stacktrace
          fi

      - name: Find & Package APK
        run: |
          mkdir -p build-artifacts
          find . -name "*.apk" -type f -exec cp {} build-artifacts/app-debug.apk \; || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SreymaraStandaloneAPK
          path: |
            build-artifacts/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
