<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="max-age=0, must-revalidate" />
    
    <!-- Aggressive Cache Buster & Crash Handler -->
    <script>
      (function() {
        // Remove _t parameter from URL to keep URLs clean
        if (typeof window !== 'undefined' && window.location) {
          const url = new URL(window.location.href);
          if (url.searchParams.has('_t')) {
            url.searchParams.delete('_t');
            window.history.replaceState({}, '', url.toString());
            console.log('[URL Cleaner] Removed _t parameter from URL');
          }
        }

        // Version-based cache busting - update this number on critical deployments
        const CACHE_BUSTER_VERSION = '20250523-v4';
        const storedVersion = localStorage.getItem('app_version');
        
        // If version mismatch, clear caches and reload
        if (storedVersion !== CACHE_BUSTER_VERSION) {
          console.log('[Cache Buster] Version mismatch, clearing caches...');
          
          // Clear all localStorage
          try {
            localStorage.clear();
          } catch(e) { console.error('[Cache Buster] Failed to clear localStorage:', e); }
          
          // Clear all sessionStorage
          try {
            sessionStorage.clear();
          } catch(e) { console.error('[Cache Buster] Failed to clear sessionStorage:', e); }
          
          // Clear service worker caches if registered
          if ('serviceWorker' in navigator && navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              registrations.forEach(function(registration) {
                registration.unregister();
              });
            }).catch(function(e) {
              console.error('[Cache Buster] Failed to unregister service workers:', e);
            });
          }
          
          // Store new version
          try {
            localStorage.setItem('app_version', CACHE_BUSTER_VERSION);
          } catch(e) {}
          
          // Force reload with cache bypass using timestamp
          const url = new URL(window.location.href);
          if (!url.searchParams.has('reloaded')) {
            url.searchParams.set('_t', new Date().getTime());
            url.searchParams.set('reloaded', 'true');
            window.location.href = url.href;
          }
          return;
        }
        
        // Track if React app has mounted successfully
        let appMounted = false;
        let mountTimeout;
        
        // Set a timeout to detect hung loading state (15 seconds)
        mountTimeout = setTimeout(function() {
          if (!appMounted) {
            console.error('[Crash Handler] App failed to mount within 15 seconds, forcing reload...');
            try {
              localStorage.clear();
              sessionStorage.clear();
            } catch(e) {}
            
          }
        }, 15000);
        
        // Signal that app mounted successfully (called from React app)
        window.appMounted = function() {
          appMounted = true;
          clearTimeout(mountTimeout);
          console.log('[Crash Handler] App mounted successfully');
        };
        
        // Global error handler - enhanced to catch module loading failures
        window.onerror = function(msg, url, line, col, error) {
          console.error('[Crash Handler] Global error detected:', msg, error);
          
          const errorMessage = msg ? msg.toString() : '';
          const errorName = error ? error.name : '';
          
          // Reload on critical errors including module loading failures
          const criticalErrors = ['TypeError', 'ReferenceError', 'SyntaxError', 'ChunkLoadError', 'LoadError'];
          const moduleLoadKeywords = ['Failed to load module', 'Loading chunk', 'Failed to fetch dynamically imported module'];
          
          if (
            criticalErrors.some(name => errorName.includes(name)) ||
            moduleLoadKeywords.some(keyword => errorMessage.includes(keyword))
          ) {
            console.error('[Crash Handler] Critical error/module load failure detected, clearing caches and reloading...');
            try {
              localStorage.clear();
              sessionStorage.clear();
              
              // Clear service worker caches
              if ('serviceWorker' in navigator && navigator.serviceWorker) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                  registrations.forEach(function(registration) {
                    registration.unregister();
                  });
                }).catch(function(e) {
                  console.error('[Crash Handler] Failed to unregister service workers:', e);
                });
              }
            } catch(e) {}
            setTimeout(function() {
              
            }, 500);
          }
          
          // Return false to prevent default error handling
          return false;
        };
        
        // Unhandled promise rejection handler - enhanced for module failures
        window.addEventListener('unhandledrejection', function(event) {
          console.error('[Crash Handler] Unhandled promise rejection:', event.reason);
          
          // Only reload on critical rejections
          if (event.reason && typeof event.reason === 'object') {
            const reasonStr = event.reason.toString().toLowerCase();
            const criticalKeywords = ['chunk', 'load', 'network', 'fetch', 'timeout', 'module'];
            
            if (criticalKeywords.some(keyword => reasonStr.includes(keyword))) {
              console.error('[Crash Handler] Critical promise rejection/module load failure, clearing caches and reloading...');
              try {
                localStorage.clear();
                sessionStorage.clear();
                
                // Clear service worker caches
                if ('serviceWorker' in navigator && navigator.serviceWorker) {
                  navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    registrations.forEach(function(registration) {
                      registration.unregister();
                    });
                  }).catch(function(e) {
                    console.error('[Crash Handler] Failed to unregister service workers:', e);
                  });
                }
              } catch(e) {}
              setTimeout(function() {
                
              }, 500);
            }
          }
        });
        
        console.log('[Cache Buster] Initialized with version:', CACHE_BUSTER_VERSION);
      })();
    </script>
